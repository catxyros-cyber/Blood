# MOTION Client — the in-game half of MOTION (Right Shift menu, skyboxes, weather visuals, HUD).
# Every property used in resource files must also be listed in buildSrc/.../multiloader-common.gradle (expandProps).

# Project
version=0.2.13
group=dev.bloom.client
java_version=21

# Common
minecraft_version=1.21.1
mod_name=MOTION Client
mod_author=MOTION
mod_id=bloomclient
license=All-Rights-Reserved
credits=
description=MOTION's in-game client: a Right Ctrl visuals menu with real shader effects (colour grading, glow, sharpening), 36 skyboxes, a Right Shift menu, a drag-and-drop HUD (FPS, coordinates, armor, potions, keystrokes, clock and more), a custom crosshair, custom skyboxes and decorative weather. Client-side only.
minecraft_version_range=[1.21.1, 1.21.2)
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric (also runs on Quilt through Quilt's Fabric compatibility)
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
