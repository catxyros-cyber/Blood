# Temporary (Home redesign): renders the launcher UI in a browser with a mocked backend and
# publishes before/after screenshots to the ci-logs/launcher-ui branch. Removed once the redesign lands.
name: UI preview
on:
  push:
    branches: [launcher-clean-ui]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Typecheck
        id: tsc
        continue-on-error: true
        run: npm run typecheck -w @bloom/launcher 2>&1 | tee "$RUNNER_TEMP/tsc.txt"
      - name: Launcher tests
        continue-on-error: true
        run: npm test -w @bloom/launcher > "$RUNNER_TEMP/tests.txt" 2>&1
      - name: Screenshots
        run: |
          set +e
          PAGES=(
            'home+tall={"page":"home"}'
            'home-noskin@noskin={"page":"home"}'
            'home~1040x680={"page":"home"}'
            'home-1600~1600x900={"page":"home"}'
            'home-crimson@theme=crimson={"page":"home"}'
            'skins={"page":"skins"}'
          )
          mkdir -p "$RUNNER_TEMP/out/after"
          cp "$GITHUB_WORKSPACE/apps/launcher/preview/shoot.mjs" "$RUNNER_TEMP/pw/"
          (cd "$GITHUB_WORKSPACE/apps/launcher" && npx vite --port 1420 --strictPort > "$RUNNER_TEMP/out/after/vite.log" 2>&1 &)
          for i in $(seq 60); do curl -s localhost:1420 >/dev/null && break; sleep 1; done
          (cd "$RUNNER_TEMP/pw" && node shoot.mjs "$RUNNER_TEMP/out/after" "${PAGES[@]}") > "$RUNNER_TEMP/out/after/errors.txt" 2>&1
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cd "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/tsc.txt" . 2>/dev/null; tail -30 "$RUNNER_TEMP/tests.txt" > tests.txt 2>/dev/null
          git init -q && git checkout -q -b log && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "UI preview for ${{ github.sha }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs/launcher-ui
