name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Tests (TypeScript + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
          POSTGRES_DB: bloom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://bloom:bloom@localhost:5432/bloom_test
      - name: Build API
        run: npm run build:api
      - name: Build launcher UI
        run: npm run build -w @bloom/launcher

  client-mod:
    name: BLOOD Client mod (Fabric + NeoForge, MC 1.21.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jars and run core tests
        working-directory: apps/client-mod
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-client-jars
          path: |
            apps/client-mod/fabric/build/libs/bloomclient-fabric-*.jar
            apps/client-mod/neoforge/build/libs/bloomclient-neoforge-*.jar
            !apps/client-mod/**/*-sources.jar
          if-no-files-found: error

  client-mod-12111:
    name: BLOOD Client mod (Fabric, MC 1.21.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Loom 1.18 runs on Java 25; the mod itself is still compiled for Java 21.
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Minecraft 1.21.11 jar
        working-directory: apps/client-mod/mc1.21.11
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-client-jars-12111
          path: |
            apps/client-mod/mc1.21.11/build/libs/bloomclient-fabric-1.21.11-*.jar
            !apps/client-mod/**/*-sources.jar
          if-no-files-found: error

  windows:
    name: Windows build (unsigned)
    needs: client-mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri
      - uses: actions/download-artifact@v4
        with:
          name: bloom-client-jars
          path: apps/client-mod
      - uses: actions/download-artifact@v4
        # Optional: if the 1.21.11 build failed, the release ships without it.
        continue-on-error: true
        with:
          name: bloom-client-jars-12111
          path: apps/client-mod
      - name: Bundle BLOOD Client into the installer
        run: node apps/client-mod/tools/bundle.mjs
      - run: npm install --no-audit --no-fund
      - name: Rust tests
        run: cargo test --manifest-path apps/launcher/src-tauri/Cargo.toml
      - name: Build installer
        run: npm run tauri -w @bloom/launcher -- build --config src-tauri/tauri.ci.conf.json
        env:
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
          VITE_BLOOM_API_URL: ${{ vars.VITE_BLOOM_API_URL }}
          BLOOM_CONTACT: ${{ vars.BLOOM_CONTACT }}
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-windows-unsigned
          path: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            apps/launcher/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
