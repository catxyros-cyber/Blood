name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Tests (TypeScript + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bloom
          POSTGRES_PASSWORD: bloom
          POSTGRES_DB: bloom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://bloom:bloom@localhost:5432/bloom_test
      - name: Build API
        run: npm run build:api
      - name: Build launcher UI
        run: npm run build -w @bloom/launcher

  client-mod:
    name: MOTION Client mod (Fabric + NeoForge, MC 1.21.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jars and run core tests
        working-directory: apps/client-mod
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Check optional hooks resolved
        run: python3 apps/client-mod/tools/check-hooks.py $(ls apps/client-mod/fabric/build/libs/bloomclient-fabric-*.jar | grep -v sources)
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-client-jars
          path: |
            apps/client-mod/fabric/build/libs/bloomclient-fabric-*.jar
            apps/client-mod/neoforge/build/libs/bloomclient-neoforge-*.jar
            !apps/client-mod/**/*-sources.jar
          if-no-files-found: error

  mod-targets:
    name: List MOTION Client build targets
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "list=$(python3 -c 'import json; print(json.dumps([t["id"] for t in json.load(open("apps/client-mod/modern/versions.json"))["targets"]]))')" >> "$GITHUB_OUTPUT"

  client-mod-modern:
    name: MOTION Client mod (Fabric, MC ${{ matrix.target }})
    needs: mod-targets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Every target in apps/client-mod/modern/versions.json.
        target: ${{ fromJSON(needs.mod-targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Loom runs on Java 25; 1.21.x jars are still compiled for Java 21.
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Minecraft ${{ matrix.target }} jar
        working-directory: apps/client-mod/modern
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build -Ptarget=${{ matrix.target }} --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Check optional hooks resolved
        run: python3 apps/client-mod/tools/check-hooks.py $(ls apps/client-mod/modern/build/libs/bloomclient-fabric-${{ matrix.target }}-*.jar | grep -v sources)
      - name: Publish the build log to a ci-logs branch
        # The Actions log viewer isn't reachable from every tool; a branch is.
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/logrepo" && cd "$RUNNER_TEMP/logrepo"
          cp "$RUNNER_TEMP/build.log" build.log 2>/dev/null || echo "no build log" > build.log
          grep -nE "error:|warning: \[|FAILURE|What went wrong|Could not|Exception" build.log | head -3000 > errors.txt || true
          if [ -f "$GITHUB_WORKSPACE/apps/client-mod/modern/probe.txt" ]; then
            # The Minecraft jar with Mojang names: on 1.21.x the mapped one Loom made, on 26.x the game jar itself.
            find ~/.gradle/caches "$GITHUB_WORKSPACE/apps/client-mod/modern/.gradle" -name 'minecraft-*.jar' ! -name '*sources*' -size +5M 2>/dev/null > jars.txt || true
            MCV=$(python3 -c "import json; print(next(t['mc'] for t in json.load(open('$GITHUB_WORKSPACE/apps/client-mod/modern/versions.json'))['targets'] if t['id']=='${{ matrix.target }}'))")
            grep -F -- "$MCV" jars.txt > mine.txt
            # Mojang-named and merged (client + server classes): Loom's mapped jar on 1.21.x, the merged jar on 26.x.
            JAR=$(grep -vi intermediary mine.txt | grep -iE 'layered|merged-deobf|minecraft-merged' | grep -v extracted | xargs -r ls -S 2>/dev/null | head -1)
            [ -z "$JAR" ] && JAR=$(grep -i client mine.txt | head -1)
            cp jars.txt jars-all.txt
            echo "jar: $JAR" > probe.txt
            grep -vE '^\s*(#|$)' "$GITHUB_WORKSPACE/apps/client-mod/modern/probe.txt" | while read -r line; do
              if [[ "$line" == pkg:* ]]; then
                echo "== package ${line#pkg:}" >> probe.txt
                unzip -Z1 "$JAR" | grep "^${line#pkg:}/[^/]*\.class$" | sed 's/\.class$//' >> probe.txt
              elif [[ "$line" == tree:* ]]; then
                echo "== tree ${line#tree:}" >> probe.txt
                unzip -Z1 "$JAR" | grep "^${line#tree:}/.*\.class$" | grep -v '\$' | sed 's/\.class$//' >> probe.txt
              else
                echo "== class $line" >> probe.txt
                javap -cp "$JAR" -p "$line" >> probe.txt 2>&1
              fi
            done
          fi
          git init -q && git checkout -q -b log
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "Build log for ${{ matrix.target }} (${{ github.event.pull_request.head.sha || github.sha }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-client-jars-modern-${{ matrix.target }}
          path: |
            apps/client-mod/modern/build/libs/bloomclient-fabric-${{ matrix.target }}-*.jar
            !apps/client-mod/**/*-sources.jar
          if-no-files-found: error

  windows:
    name: Windows build (unsigned)
    needs: [client-mod, client-mod-modern]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri
      - uses: actions/download-artifact@v4
        with:
          name: bloom-client-jars
          path: apps/client-mod
      - uses: actions/download-artifact@v4
        with:
          pattern: bloom-client-jars-modern-*
          merge-multiple: true
          path: apps/client-mod/modern/build/libs
      - name: Bundle MOTION Client into the installer
        run: node apps/client-mod/tools/bundle.mjs
      - run: npm install --no-audit --no-fund
      - name: Rust tests
        run: cargo test --manifest-path apps/launcher/src-tauri/Cargo.toml
      - name: Build installer
        run: npm run tauri -w @bloom/launcher -- build --config src-tauri/tauri.ci.conf.json
        env:
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
          VITE_BLOOM_API_URL: ${{ vars.VITE_BLOOM_API_URL }}
          BLOOM_CONTACT: ${{ vars.BLOOM_CONTACT }}
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-windows-unsigned
          path: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            apps/launcher/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
